syntax = "proto3";

option java_package = "com.paceai.user.grpc";
option java_outer_classname = "UserProto";

package user;

service UserService {
  rpc GetUser (GetUserRequest) returns (UserResponse);
}

message GetUserRequest {
  int64 user_id = 1;
}

message UserResponse {
  int64 id = 1;
  string username = 2;
  string email = 3;
}