spring.application.name=message-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5435/messagedb
spring.datasource.username=messageservice
spring.datasource.password=${MESSAGE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# gRPC klient mot User Service
grpc.client.user-service.address=static://localhost:9090
grpc.client.user-service.negotiation-type=plaintext

